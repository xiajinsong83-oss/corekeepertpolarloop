# Core Keeper 模组索引数据（P2-2）
# 数据来源：官方模组文档 modding.corekeepergame.com（GitBook，2026-10-18 核实）
# 关键事实：
# - 官方仅支持两大平台：Steam Workshop（AppID 1621690）与 mod.io（g/corekeeper）
# - Mod SDK 与 Steam Workshop 集成处于 beta；Mod SDK 版本线见官方 changelog
# - 官方文档不含 CoreLib（社区基础库，非官方术语，勿在站内宣称官方依赖）
# - 安装：订阅 → 重启游戏 → 自动更新（游戏关闭时）；检查依赖；用版本过滤器避免过时模组
mods_platforms:
  - name: "Steam Workshop"
    desc: "官方支持的模组平台，游戏内订阅，重启后生效，关闭游戏时自动更新。"
    url: "https://steamcommunity.com/workshop/browse/?appid=1621690&browsesort=trend&section=readytouseitems"
    icon: "/img/app-icons/mods.png"
    steps:
      - "在 Steam 创意工坊浏览 Core Keeper 模组（建议按 Trending/最新排序）"
      - "点击订阅需要的模组（注意看作者标注的游戏版本兼容）"
      - "重启 Core Keeper 使模组生效；更新会在游戏关闭时自动拉取"
  - name: "mod.io"
    desc: "官方支持的跨平台模组库，网页订阅或游戏内 MODS 菜单安装，关闭游戏时自动更新。"
    url: "https://mod.io/g/corekeeper"
    icon: "/img/app-icons/mods.png"
    steps:
      - "访问 mod.io/g/corekeeper 浏览模组（使用版本过滤器筛选当前游戏版本）"
      - "点击订阅；或直接在游戏主菜单的 MODS 界面浏览订阅"
      - "阅读模组描述，安装其声明的依赖后再启用；重启游戏生效"

resources:
  - name: "Official Modding Docs"
    desc: "官方模组开发文档（SDK、代码示例、上传指南）"
    url: "https://modding.corekeepergame.com"
  - name: "Official Discord"
    desc: "官方模组社区 Discord —— 支持、讨论、反馈"
    url: "https://discord.gg/corekeeper"
  - name: "Mod SDK Changelog"
    desc: "Mod SDK 版本更新日志（beta 状态跟踪）"
    url: "https://modding.corekeepergame.com/changelog/mod-sdk-changelog.md"

warnings:
  - "官方仅支持 Steam Workshop 与 mod.io 两大平台，其他第三方平台（如 Thunderstore、Nexus Mods 上的历史 Core Keeper 板块）多已停更或废弃，且不受官方支持——安装前请以 modding.corekeepergame.com 官方说明为准。"
  - "安装模组前务必核对模组标注的游戏版本（当前站点追踪版本 1.3.0.6）；版本不匹配的模组可能导致存档或联机异常。"
  - "官方文档不包含 CoreLib：部分社区模组会要求 CoreLib 作为依赖，是否使用请以具体模组描述为准。"
