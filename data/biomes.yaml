# Core Keeper 生物群系数据（阶段2 初始集，环带结构）
# 环带距离参考官方 Wiki（corekeeper.atma.gg/en/World），发布前需按版本核对
biomes:
  - name: "The Undergrounds"
    icon: "/img/app-icons/biome-dirt.png"
    ring: "Center"
    distance: "0–140 tiles"
    danger: "Low"
    resources: ["Copper Ore", "Tin Ore", "Wood", "Stone", "Food crops"]
    note: "Default biome; safe starting area around The Core"
  - name: "The Clay Caves"
    icon: "/img/app-icons/biome-clay.png"
    ring: "Inner ring"
    distance: "150–450 tiles"
    danger: "Medium"
    resources: ["Clay", "Iron Ore", "Larva Hive entrance"]
    note: "Angular position varies by seed"
  - name: "The Forgotten Ruins"
    icon: "/img/app-icons/biome-ruins.png"
    ring: "Inner ring"
    distance: "150–450 tiles"
    danger: "Medium"
    resources: ["Stone", "Scarlet Ore", "Ruins chests"]
    note: "Also called the stone biome; position varies by seed"
  - name: "The Great Wall"
    icon: "/img/app-icons/biome-wall.png"
    ring: "Gate ring"
    distance: "450–520 tiles"
    danger: "High"
    resources: ["None (barrier)"]
    note: "Gates access to outer biomes until progression is met"
  - name: "Azeos' Wilderness"
    icon: "/img/app-icons/biome-azeos.png"
    ring: "Outer ring"
    distance: "520–1200 tiles"
    danger: "High"
    resources: ["Gold Ore", "Mold sub-biome", "Azeos arena"]
    note: "One of three outer biomes; counter-clockwise order by seed"
  - name: "The Sunken Sea"
    icon: "/img/app-icons/biome-sea.png"
    ring: "Outer ring"
    distance: "520–1200 tiles"
    danger: "High"
    resources: ["Fish", "Coral", "Omoroth arena"]
    note: "Water-filled outer biome"
  - name: "The Desert of Beginnings"
    icon: "/img/app-icons/biome-desert.png"
    ring: "Outer ring"
    distance: "520–1200 tiles"
    danger: "High"
    resources: ["Sand", "Cactus", "Ra-Akar arena"]
    note: "Hottest outer biome"
  - name: "The Passage"
    icon: "/img/app-icons/biome-passage.png"
    ring: "Beyond outer ring"
    distance: "≈1200+ tiles"
    danger: "Very High"
    resources: ["Endgame materials", "Titan arenas"]
    note: "Endgame area; reachable after main progression"
  # source: https://corekeeper.atma.gg/en/Larva_Hive_Biome
  - name: "Larva Hive Biome"
    icon: "/img/app-icons/biomes.png"
    ring: "Sub-biome of The Clay Caves"
    distance: "Within inner ring (~330 tiles, Hive Mother)"
    danger: "Medium"
    resources: ["Larva Hive Block", "Chrysalis", "Ground Acid Slime", "Larva Meat", "The Hive Mother"]
    note: "Maze-like organic dungeon; slimes do not spawn here"
  # source: https://corekeeper.atma.gg/en/Mold_Biome
  - name: "Mold Biome"
    icon: "/img/app-icons/biomes.png"
    ring: "Sub-biome of Azeos' Wilderness"
    distance: "Within outer ring (Main Mold Dungeon ~750 tiles)"
    danger: "High"
    resources: ["Mold Ground", "Fungal Bone", "Mold Tree", "Mold Vein Necklace", "Mold Ring"]
    note: "Fungus-infested dungeon; Mold Ground slows players by up to 75%"
  # source: https://corekeeper.atma.gg/en/Forlorn_Metropolis
  - name: "Forlorn Metropolis"
    icon: "/img/app-icons/biomes.png"
    ring: "Sub-biome of The Sunken Sea"
    distance: "Within outer ring"
    danger: "High"
    resources: ["Octarine Ore", "Urban Moss", "Coral Wood", "Mechanical Part", "Phantom Spark materials"]
    note: "Ruined hi-tech dungeon; Caveling Scholars support Core Sentry"
  # source: https://corekeeper.atma.gg/en/Molten_Quarry
  - name: "Molten Quarry"
    icon: "/img/app-icons/biomes.png"
    ring: "Sub-biome of The Desert of Beginnings"
    distance: "Within outer ring (~650 tiles, Igneous)"
    danger: "High"
    resources: ["Ground Magma Slime", "Lava", "Galaxite Ore", "Cipher Parchment", "Ancient Forge"]
    note: "Volcanic area; home of Igneous the Molten Mass and the Ancient Forge"
  # source: https://corekeeper.atma.gg/en/The_Shimmering_Frontier
  - name: "The Shimmering Frontier"
    icon: "/img/app-icons/biomes.png"
    ring: "Ring around the outer biomes"
    distance: "≈1200+ tiles"
    danger: "Very High"
    resources: ["Solarite Ore", "Gleam Wood", "Crystal Block", "Jungle Emerald", "Ocean Sapphire", "Desert Ruby"]
    note: "Bright blue crystal biome; source of Solarite and unique gems"
  # source: https://corekeeper.atma.gg/en/Breaker%27s_Reach
  - name: "Breaker's Reach"
    icon: "/img/app-icons/biomes.png"
    ring: "Beyond The Passage (far north)"
    distance: "≈1450+ tiles"
    danger: "Very High"
    resources: ["Relucite Ore", "Corrupted Alloy", "Rust Pile", "Void materials", "Glowing Mushroom"]
    note: "Mechanical/void late-game biome from the Void & Voltage update"
