<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }} — {{ .Site.Params.siteDescription }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.siteDescription }}{{ end }}">
<meta name="keywords" content="{{ with .Params.keywords }}{{ delimit . ", " }}{{ else }}{{ .Site.Params.siteKeywords }}{{ end }}">
{{ if .Params.canonical }}<link rel="canonical" href="{{ .Params.canonical }}">{{ else }}<link rel="canonical" href="{{ .Permalink }}">{{ end }}
{{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .Permalink }}">{{ end }}

<!-- Google AdSense 统一发布商（全站生效） -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3866829862674413" crossorigin="anonymous"></script>

<!-- favicon -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<!-- 像素风格全站样式 -->
<style>
:root{--bg:#101613;--panel:#1a2621;--line:#2e423a;--ink:#e9efe9;--ink2:#a9b8b0;--gold:#e6b34d;--gold2:#f2cc7a;--green:#7fd6a0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.7;font-size:16px}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--gold2)}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.site-header{border-bottom:1px solid var(--line);padding:16px 0;background:var(--bg)}
.site-header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:700;font-size:20px;color:#fff}
.brand span{color:var(--gold)}
.nav{display:flex;flex-wrap:wrap;gap:6px 16px;list-style:none}
.nav a{font-size:15px;color:var(--ink2)}
.nav a:hover{color:var(--gold2)}
.site-main{min-height:60vh;padding:28px 0}
.hero{padding:40px 0 30px;border-bottom:1px solid var(--line);margin-bottom:26px}
.hero h1{font-size:clamp(26px,4.5vw,40px);color:#fff;line-height:1.2}
.hero p{color:var(--ink2);margin-top:8px;max-width:720px}
.searchbox{margin-top:20px;display:flex;gap:8px;max-width:560px}
.searchbox input{flex:1;padding:12px 14px;font-size:16px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:0}
.searchbox button{padding:12px 20px;font-size:16px;background:var(--gold);color:#101613;border:none;font-weight:700;cursor:pointer}
.section-title{font-size:22px;color:#fff;margin:30px 0 14px;padding-left:12px;border-left:4px solid var(--gold)}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:980px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);padding:16px;display:flex;gap:12px;align-items:flex-start}
.card img{width:56px;height:56px;object-fit:cover;image-rendering:pixelated;flex:none;background:#000}
.card h3{font-size:16px;color:#fff;margin-bottom:4px}
.card p{font-size:14px;color:var(--ink2)}
.card .tag{display:inline-block;font-size:11px;color:var(--gold);border:1px solid var(--line);padding:1px 8px;margin-top:6px}
.postlist{list-style:none}
.postlist li{padding:10px 0;border-bottom:1px solid var(--line)}
.postlist a{font-size:16px;color:var(--ink)}
.postlist a:hover{color:var(--gold2)}
.postlist .meta{font-size:12.5px;color:var(--ink2)}
.site-footer{border-top:1px solid var(--line);padding:28px 0;margin-top:40px;font-size:14px;color:var(--ink2)}
.site-footer .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;align-items:center}
.site-footer a{color:var(--ink2)}
.site-footer a:hover{color:var(--gold2)}
.article{max-width:760px}
.article h1{font-size:30px;color:#fff;margin-bottom:10px}
.article h2{font-size:23px;color:#fff;margin:26px 0 10px}
.article h3{font-size:18px;color:var(--gold2);margin:20px 0 8px}
.article p,.article li{color:var(--ink2);font-size:15.5px}
.article ul,.article ol{padding-left:22px;margin:8px 0}
.article table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14.5px}
.article th,.article td{border:1px solid var(--line);padding:8px 10px;text-align:left}
.article th{background:var(--panel);color:#fff}
.article code{background:var(--panel);padding:1px 6px;font-size:13.5px;color:var(--gold2)}
.adslot{margin:20px 0;min-height:90px;background:var(--panel);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:13px}
.crumb{font-size:13px;color:var(--ink2);margin-bottom:14px}
.crumb a{color:var(--ink2)}
.crumb a:hover{color:var(--gold2)}
</style>
