{{ $slot := .Site.Params.adsenseSlotPlaceholder | default "0000000000" }}
<div class="adslot" style="text-align:center">
  <!-- 广告位：创建广告单元后回填真实 data-ad-slot -->
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-3866829862674413"
       data-ad-slot="{{ $slot }}"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
