{{ $data := site.Data.bosses.bosses }}
{{ $id := printf "boss-finder-%s" (md5 .Page.Title | truncate 8) }}
<div class="tool-app" style="border:1px solid #2e423a;background:#1a2621;padding:16px;margin:14px 0">
  <label for="{{ $id }}-select" style="font-size:15px;color:#fff;font-weight:700;display:block;margin-bottom:8px">Select a boss</label>
  <select id="{{ $id }}-select" style="width:100%;padding:12px;font-size:16px;background:#101613;color:#e9efe9;border:1px solid #2e423a;margin-bottom:12px">
    <option value="">— Choose a boss —</option>
    {{ range $data }}<option value="{{ .name }}">{{ .name }}</option>{{ end }}
  </select>
  <div id="{{ $id }}-result" style="display:none"></div>
</div>
<script>
(function(){
  var data = {{ jsonify $data }};
  var sel = document.getElementById('{{ $id }}-select');
  var out = document.getElementById('{{ $id }}-result');
  if(!sel || !out) return;
  sel.addEventListener('change', function(){
    var name = sel.value;
    if(!name){ out.style.display='none'; out.innerHTML=''; return; }
    var b = null;
    for(var i=0;i<data.length;i++){ if(data[i].name===name){ b=data[i]; break; } }
    if(!b){ out.style.display='none'; return; }
    var h = '<div style="border-bottom:1px solid #2e423a;padding-bottom:10px;margin-bottom:10px">';
    h += '<div style="font-size:18px;color:#f2cc7a;font-weight:700">'+b.name+'</div>';
    h += '<div style="font-size:13.5px;color:#a9b8b0;margin-top:4px"><b style="color:#fff">Biome:</b> '+b.biome+' · <b style="color:#fff">Tier:</b> '+b.tier+'</div>';
    h += '<div style="font-size:13.5px;color:#a9b8b0;margin-top:4px"><b style="color:#fff">Unlock:</b> '+b.unlock+'</div></div>';
    h += '<table style="width:100%;border-collapse:collapse;font-size:14px"><thead><tr style="background:#101613"><th style="border:1px solid #2e423a;padding:8px;text-align:left;color:#fff">Drop</th><th style="border:1px solid #2e423a;padding:8px;text-align:left;color:#fff">Chance</th><th style="border:1px solid #2e423a;padding:8px;text-align:left;color:#fff">Note</th></tr></thead><tbody>';
    for(var j=0;j<b.drops.length;j++){
      var d=b.drops[j];
      h += '<tr><td style="border:1px solid #2e423a;padding:8px;color:#e9efe9">'+d.item+'</td><td style="border:1px solid #2e423a;padding:8px;color:#7fd6a0">'+d.chance+'</td><td style="border:1px solid #2e423a;padding:8px;color:#a9b8b0">'+d.note+'</td></tr>';
    }
    h += '</tbody></table>';
    out.innerHTML = h;
    out.style.display='block';
  });
})();
</script>
