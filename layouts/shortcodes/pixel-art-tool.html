{{/* 工具4：像素画工具 — 上传图片 → 网格像素化 + 色板 + PNG 导出（纯前端 canvas） */}}
<div id="ck-pixel-app" style="border:1px solid #2e423a;background:#1a2621;border-radius:10px;padding:18px;margin:18px 0">
  <div style="font-size:13px;color:#a9b8b0;margin-bottom:12px">Upload any image and convert it into a blocky pixel-art canvas — perfect for planning in-game pixel builds (billboards, farms, pixel murals). Runs entirely in your browser.</div>
  <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px">
    <input id="ck-file" type="file" accept="image/*" style="font-size:13px;color:#a9b8b0">
    <label style="font-size:13.5px;color:#a9b8b0">Grid
      <select id="ck-grid" style="background:#101613;color:#e8f0ea;border:1px solid #2e423a;border-radius:5px;padding:6px 10px;font-size:13px">
        <option value="32">32 × 32</option>
        <option value="48" selected>48 × 48</option>
        <option value="64">64 × 64</option>
        <option value="96">96 × 96</option>
      </select>
    </label>
    <button id="ck-dl" style="background:#e6b34d;color:#101613;border:none;border-radius:6px;padding:8px 16px;font-size:13px;cursor:pointer;display:none">Download PNG</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:16px">
    <div id="ck-canvas-wrap" style="background:#101613;border:1px solid #2e423a;border-radius:6px;padding:8px;flex:1;min-width:280px;text-align:center"></div>
    <div id="ck-palette" style="flex:0 0 170px;background:#101613;border:1px solid #2e423a;border-radius:6px;padding:10px;font-size:12.5px;color:#a9b8b0"></div>
  </div>
</div>
<script>
(function () {
  var file = document.getElementById('ck-file');
  var grid = document.getElementById('ck-grid');
  var wrap = document.getElementById('ck-canvas-wrap');
  var pal = document.getElementById('ck-palette');
  var dl = document.getElementById('ck-dl');
  var srcImg = null, outCanvas = null;

  file.addEventListener('change', function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () { srcImg = img; render(); };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  });
  grid.addEventListener('change', render);

  function render() {
    if (!srcImg) return;
    var g = parseInt(grid.value, 10);
    var c = document.createElement('canvas');
    c.width = g; c.height = g;
    var ctx = c.getContext('2d');
    var sw = srcImg.width, sh = srcImg.height;
    var s = Math.max(sw, sh);
    var ox = (s - sw) / 2 / s, oy = (s - sh) / 2 / s;
    var srcC = document.createElement('canvas');
    srcC.width = sw; srcC.height = sh;
    srcC.getContext('2d').drawImage(srcImg, 0, 0);
    var sd = srcC.getContext('2d').getImageData(0, 0, sw, sh).data;
    var px = 1 / s;
    for (var y = 0; y < g; y++) {
      for (var x = 0; x < g; x++) {
        var sx = Math.floor((x / g + ox) / px);
        var sy = Math.floor((y / g + oy) / px);
        sx = Math.min(sw - 1, Math.max(0, sx));
        sy = Math.min(sh - 1, Math.max(0, sy));
        var i = (sy * sw + sx) * 4;
        ctx.fillStyle = 'rgb(' + sd[i] + ',' + sd[i + 1] + ',' + sd[i + 2] + ')';
        ctx.fillRect(x, y, 1, 1);
      }
    }
    outCanvas = c;
    // display scaled with pixelated rendering
    var disp = document.createElement('canvas');
    disp.width = g * 6; disp.height = g * 6;
    var dctx = disp.getContext('2d');
    dctx.imageSmoothingEnabled = false;
    dctx.drawImage(c, 0, 0, g * 6, g * 6);
    wrap.innerHTML = '';
    wrap.appendChild(disp);
    dl.style.display = 'inline-block';
    // palette
    var counts = {};
    var id = c.getContext('2d').getImageData(0, 0, g, g).data;
    for (var y = 0; y < g; y++) for (var x = 0; x < g; x++) {
      var i = (y * g + x) * 4;
      var key = rgb(id[i], id[i + 1], id[i + 2]);
      counts[key] = (counts[key] || 0) + 1;
    }
    var arr = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; }).slice(0, 12);
    var html = '<div style="color:#7fd6a0;margin-bottom:6px">PALETTE (top ' + arr.length + ' of ' + Object.keys(counts).length + ')</div>';
    arr.forEach(function (k) {
      var pct = Math.round(counts[k] / (g * g) * 100);
      html += '<div style="display:flex;align-items:center;gap:6px;margin:3px 0">'
        + '<span style="width:18px;height:18px;background:' + k + ';border:1px solid #2e423a;display:inline-block"></span>'
        + '<span style="font-size:11px;color:#a9b8b0">' + k + '</span>'
        + '<span style="font-size:10.5px;color:#6d7f76">' + pct + '%</span></div>';
    });
    pal.innerHTML = html;
  }
  function rgb(r, g, b) {
    function h(v) { var s = v.toString(16); return s.length < 2 ? '0' + s : s; }
    return '#' + h(r) + h(g) + h(b);
  }
  dl.addEventListener('click', function () {
    if (!outCanvas) return;
    var a = document.createElement('a');
    a.download = 'pixel-art-' + grid.value + '.png';
    a.href = outCanvas.toDataURL('image/png');
    a.click();
  });
})();
</script>
